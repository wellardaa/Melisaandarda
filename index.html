<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIVATE & BOUND | D/C +18</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #020203;
            color: #ececec;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #2b0407 0%, #020203 85%);
        }

        .header { text-align: center; margin-bottom: 25px; }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #ff2a2a, #aa1111, #fff5c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 42, 42, 0.3);
        }

        .sub-brand {
            font-size: 10px;
            letter-spacing: 4px;
            color: #ff3333;
            margin-top: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .container { width: 100%; max-width: 460px; }

        .card {
            background: linear-gradient(145deg, #120606, #040101);
            border: 1px solid #4a0d0d;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(180, 10, 10, 0.25);
            border-radius: 20px;
            padding: 30px 22px;
            text-align: center;
            position: relative;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: #d4af37;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 10px; letter-spacing: 2px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; }
        .input-group input {
            width: 100%; padding: 12px 15px; background: #1a0808; border: 1px solid #551515;
            border-radius: 10px; color: #fff; font-family: 'Montserrat', sans-serif; font-size: 13px; outline: none;
        }

        .btn {
            background: linear-gradient(135deg, #4a0000, #990000);
            border: 1px solid #cc1111; color: #fff; font-family: 'Montserrat', sans-serif;
            font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
            padding: 15px 20px; width: 100%; border-radius: 25px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 20px rgba(153, 0, 0, 0.5); margin-top: 10px;
        }
